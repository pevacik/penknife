services:
  db:
    image: postgres:16-alpine
    container_name: penknife-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: penknife
      POSTGRES_PASSWORD: penknife
      POSTGRES_DB: penknife
    ports:
      - "5432:5432"
    volumes:
      - penknife_pgdata:/var/lib/postgresql/data

volumes:
  penknife_pgdata:
